<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>MOTY 2027 Results</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/moty.css">
  <style>
    .wrap { padding-bottom: 40px; }
    .stat { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin-bottom: 10px; }
    .stat div { background: var(--cell); padding: 12px; }
    .stat b { display: block; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
    .heat .day { font-size: 14px; }
    .heat .day.h { color: var(--free-ink); border-color: transparent; }
    .detail h4 { margin: 14px 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .detail p { margin: 0; }
    .rank { padding-left: 0; list-style: none; margin: 0; }
    .rank li { padding: 9px 0; border-top: 1px solid var(--hair); }
    .rank li:first-child { border-top: 0; }
    .barrow { display: grid; grid-template-columns: 1fr 30px; gap: 8px; align-items: center; margin: 4px 0; font-size: 14px; }
    .barrow .t { position: relative; padding: 6px 8px; background: var(--cell); border: 1px solid var(--hair); overflow: hidden; }
    .barrow .t i { position: absolute; inset: 0 auto 0 0; background: var(--hair); }
    .barrow .t span { position: relative; }
    .barrow b { text-align: right; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    td { padding: 9px 4px; border-top: 1px solid var(--hair); vertical-align: top; }
    .row-btns { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
    .txt { padding: 6px 0; border-top: 1px solid var(--hair); font-size: 14px; }
    .txt b { color: var(--muted); font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <div class="meta"><span>Results</span><a class="small" href="./">Form</a></div>
      <h1>Man of the Year 2027</h1>
    </header>

    <div class="msg" id="amsg"></div>
    <section id="main" hidden>
      <div class="stat">
        <div><b id="nResp">0</b><span class="label">Responses</span></div>
        <div><b id="nMissing">0</b><span class="label">Outstanding</span></div>
      </div>
      <p class="small" id="missing"></p>

      <div class="card">
        <span class="sec">01</span><h2>Best dates</h2>
        <p class="small">Ranked by number free, then by number available if needed.</p>
        <ol class="rank" id="rank"></ol>
      </div>

      <div class="card heat">
        <span class="sec">02</span><h2>Availability</h2>
        <div class="row-btns">
          <button class="chip" id="refresh">Refresh</button>
        </div>
        <div id="cal"></div>
        <div class="detail" id="detail"><p class="small" style="margin-top:12px">Select a date for details.</p></div>
      </div>

      <div class="card"><span class="sec">03</span><h2>Questionnaire</h2><div id="answers"></div></div>

      <div class="card">
        <span class="sec">04</span><h2>Respondents</h2>
        <table id="people"></table>
        <div class="row-btns"><button class="chip" id="csv">Download CSV</button></div>
      </div>
    </section>
  </div>
  <script src="assets/api.js"></script>
  <script src="assets/results.js"></script>
</body>
</html>
